<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" role="img" aria-label="Architecture : le nœud ESP32 publie en MQTT, Node-RED enregistre dans MongoDB et pousse la dernière mesure à l'API Express, l'interface React affiche le tout.">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4cceac"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .boite { fill: #1f2a40; stroke: #3d4b6b; stroke-width: 1.5; }
    .titre { font-size: 17px; font-weight: 700; fill: #e0e0e0; text-anchor: middle; }
    .detail { font-size: 13px; fill: #a3a3a3; text-anchor: middle; }
    .lien { fill: none; stroke: #4cceac; stroke-width: 2; marker-end: url(#fleche); }
    .note { font-size: 12px; fill: #4cceac; text-anchor: middle; }
  </style>

  <rect width="1160" height="350" rx="18" fill="#141b2d"/>

  <rect class="boite" x="30" y="118" width="180" height="84" rx="10"/>
  <text class="titre" x="120" y="154">Nœud ESP32</text>
  <text class="detail" x="120" y="178">température, pression</text>

  <rect class="boite" x="270" y="118" width="180" height="84" rx="10"/>
  <text class="titre" x="360" y="154">Broker MQTT</text>
  <text class="detail" x="360" y="178">sujet aquafarm/stats</text>

  <rect class="boite" x="510" y="118" width="180" height="84" rx="10"/>
  <text class="titre" x="600" y="154">Node-RED</text>
  <text class="detail" x="600" y="178">ajoute date et heure</text>

  <rect class="boite" x="510" y="262" width="180" height="60" rx="10"/>
  <text class="titre" x="600" y="298">Alerte WhatsApp</text>

  <rect class="boite" x="750" y="38" width="180" height="84" rx="10"/>
  <text class="titre" x="840" y="74">MongoDB</text>
  <text class="detail" x="840" y="98">historique des mesures</text>

  <rect class="boite" x="750" y="198" width="180" height="84" rx="10"/>
  <text class="titre" x="840" y="234">API Express</text>
  <text class="detail" x="840" y="258">connexion JWT, rôles</text>

  <rect class="boite" x="990" y="118" width="150" height="84" rx="10" style="stroke:#4cceac"/>
  <text class="titre" x="1065" y="154">Interface React</text>
  <text class="detail" x="1065" y="178">jauges, graphiques</text>

  <path class="lien" d="M210 160 H268"/>
  <text class="note" x="240" y="150">MQTT</text>
  <path class="lien" d="M450 160 H508"/>
  <path class="lien" d="M690 145 C720 145, 720 80, 748 80"/>
  <path class="lien" d="M690 175 C720 175, 720 240, 748 240"/>
  <text class="note" x="840" y="304">reçoit la dernière mesure : POST /api/realtime</text>
  <path class="lien" d="M840 122 V196"/>
  <text class="note" x="872" y="164">lecture</text>
  <path class="lien" d="M930 240 C960 240, 960 175, 988 175"/>
  <path class="lien" d="M600 202 V260"/>
</svg>
