<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 350" role="img" aria-label="Architecture : le capteur PL309 est lu par l'ESP32 en Modbus RTU, le module SIM900 envoie la mesure en MQTT au broker Mosquitto, Node-RED l'enregistre dans MongoDB et la pousse à l'API Express, l'interface React affiche le tout.">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4cceac"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .boite { fill: #1f2a40; stroke: #3d4b6b; stroke-width: 1.5; }
    .titre { font-size: 17px; font-weight: 700; fill: #e0e0e0; text-anchor: middle; }
    .detail { font-size: 13px; fill: #a3a3a3; text-anchor: middle; }
    .lien { fill: none; stroke: #4cceac; stroke-width: 2; marker-end: url(#fleche); }
    .note { font-size: 12px; fill: #4cceac; text-anchor: middle; }
  </style>

  <rect width="1380" height="350" rx="18" fill="#141b2d"/>

  <rect class="boite" x="30" y="118" width="170" height="84" rx="10"/>
  <text class="titre" x="115" y="154">Capteur PL309</text>
  <text class="detail" x="115" y="178">pression, température</text>

  <rect class="boite" x="250" y="118" width="180" height="84" rx="10"/>
  <text class="titre" x="340" y="154">ESP32 + SIM900</text>
  <text class="detail" x="340" y="178">nœud posé sur la cage</text>

  <rect class="boite" x="480" y="118" width="180" height="84" rx="10"/>
  <text class="titre" x="570" y="154">Broker Mosquitto</text>
  <text class="detail" x="570" y="178">sujet aquafarm/stats</text>

  <rect class="boite" x="710" y="118" width="180" height="84" rx="10"/>
  <text class="titre" x="800" y="154">Node-RED</text>
  <text class="detail" x="800" y="178">ajoute date et heure</text>

  <rect class="boite" x="710" y="262" width="180" height="60" rx="10"/>
  <text class="titre" x="800" y="298">Alerte WhatsApp</text>

  <rect class="boite" x="950" y="38" width="180" height="84" rx="10"/>
  <text class="titre" x="1040" y="74">MongoDB</text>
  <text class="detail" x="1040" y="98">historique des mesures</text>

  <rect class="boite" x="950" y="198" width="180" height="84" rx="10"/>
  <text class="titre" x="1040" y="234">API Express</text>
  <text class="detail" x="1040" y="258">connexion JWT, rôles</text>

  <rect class="boite" x="1190" y="118" width="160" height="84" rx="10" style="stroke:#4cceac"/>
  <text class="titre" x="1270" y="154">Interface React</text>
  <text class="detail" x="1270" y="178">jauges, graphiques</text>

  <path class="lien" d="M200 160 H248"/>
  <text class="note" x="225" y="106">RS485 · Modbus RTU</text>
  <path class="lien" d="M430 160 H478"/>
  <text class="note" x="455" y="224">MQTT sur GPRS</text>
  <path class="lien" d="M660 160 H708"/>
  <path class="lien" d="M890 145 C920 145, 920 80, 948 80"/>
  <path class="lien" d="M890 175 C920 175, 920 240, 948 240"/>
  <text class="note" x="1040" y="304">reçoit la dernière mesure : POST /api/realtime</text>
  <path class="lien" d="M1040 122 V196"/>
  <text class="note" x="1072" y="164">lecture</text>
  <path class="lien" d="M1130 240 C1160 240, 1160 175, 1188 175"/>
  <path class="lien" d="M800 202 V260"/>
</svg>
